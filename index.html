<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ian's Library</title>
<style>
  :root{
    --ink:#1C2B39;
    --manila:#D9C9A3;
    --paper:#F3EEE0;
    --stamp:#9B3A2C;
    --sage:#5B7065;
    --line: rgba(28,43,57,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(28,43,57,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    padding: 40px 20px 80px;
  }
  .drawer-label{
    max-width: 900px; margin: 0 auto 6px; display:flex; align-items:baseline;
    justify-content:space-between; border-bottom: 3px solid var(--ink); padding-bottom: 14px;
  }
  .drawer-label h1{ font-size: 1.9rem; letter-spacing: 0.02em; margin:0; font-weight: 700; }
  .drawer-label .sub{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--sage);
  }
  .meta-row{
    max-width:900px; margin: 10px auto 30px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.75rem; color: rgba(28,43,57,0.6); display:flex; justify-content:space-between;
  }
  .status-banner{
    max-width:900px; margin: 0 auto 16px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.72rem; color: var(--stamp); display:none;
  }
  .status-banner.show{ display:block; }
  .meta-line{ font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; color: rgba(28,43,57,0.6); margin-bottom: 10px; }
  .meta-item{ margin-right: 16px; }
  .expand-box{ margin-bottom: 12px; }
  .expand-box label{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--sage); display:block; margin-bottom: 4px;
  }
  .expand-text{
    font-size: 0.92rem; line-height: 1.5; margin: 0; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .expand-text.open{ display: block; -webkit-line-clamp: unset; }
  .expand-btn{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.7rem; color: var(--stamp);
    background: none; border: none; cursor: pointer; padding: 2px 0; text-decoration: underline;
  }
  .rating-line{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; background: var(--sage);
    color: #fff; padding: 3px 8px; margin-bottom: 10px; display: inline-block; min-width: 40px;
  }
  .notes-flag{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 2px 8px; border: 1px solid var(--sage); color: var(--sage); margin-left: 8px;
  }
  .card-meta-top{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; color: rgba(28,43,57,0.55);
    margin-top: 3px;
  }
    .controls{ max-width: 900px; margin: 0 auto 20px; }
  .start-state{
    max-width:900px; margin: 0 auto 16px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85rem; color: rgba(28,43,57,0.6); padding: 4px 4px 20px;
  }
  .show-all-btn{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; border: 1px solid var(--stamp); color: var(--stamp); background: transparent;
    padding: 5px 10px; cursor: pointer; margin-left: 6px;
  }
  .show-all-btn:hover{ background: var(--stamp); color: #fff; }
  .search-box{
    width:100%; font-family: Georgia, serif; font-size: 1rem; padding: 10px 14px;
    border: 1px solid var(--ink); background: #fffdf8; margin-bottom: 12px;
  }
  .cat-filters{ display:flex; flex-wrap:wrap; gap: 8px; }
  .cat-chip{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; border: 1px solid var(--sage); color: var(--sage); background: transparent;
    padding: 5px 10px; cursor: pointer;
  }
  .cat-chip.active{ background: var(--sage); color: #fff; }
  .no-results{
    max-width:900px; margin: 0 auto; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85rem; color: rgba(28,43,57,0.5); padding: 20px 4px; display:none;
  }
  .card-cats{ display:flex; gap:6px; flex-wrap:wrap; margin-top: 6px; }
  .card-cats span{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--sage); border: 1px solid var(--line); padding: 2px 6px;
  }
  .grid{ max-width: 900px; margin: 0 auto; display:grid; grid-template-columns: 1fr; gap: 14px; }
  .card{
    background: #fffdf8; border: 1px solid var(--line); border-left: 6px solid var(--manila);
    box-shadow: 2px 3px 0 rgba(28,43,57,0.05);
  }
  .card.has-detail{ border-left-color: var(--stamp); }
  .card summary{
    list-style:none; cursor:pointer; padding: 16px 20px; display:grid;
    grid-template-columns: 90px 1fr auto; gap: 16px; align-items:center;
  }
  .card summary::-webkit-details-marker{ display:none; }
  .callnum{
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; color: var(--sage);
    border: 1px dashed var(--sage); padding: 4px 6px; text-align:center; white-space: nowrap;
  }
  .title-author .title{ font-size: 1.08rem; font-weight: 700; }
  .title-author .author{ font-size: 0.9rem; color: rgba(28,43,57,0.7); font-style: italic; }
  .chevron{ font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--ink); transition: transform 0.2s ease; }
  details[open] .chevron{ transform: rotate(90deg); }
  .detail{
    padding: 4px 20px 22px 20px; display:grid; grid-template-columns: 120px 1fr; gap: 20px;
    border-top: 1px dashed var(--line); margin: 0 20px; padding-top: 18px;
  }
  .cover img{ width: 100%; display:block; border: 1px solid var(--line); box-shadow: 3px 3px 0 rgba(28,43,57,0.08); }
  .cover .noimg{
    width:100%; aspect-ratio: 2/3; border:1px dashed var(--line); display:flex; align-items:center;
    justify-content:center; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.65rem;
    color: rgba(28,43,57,0.4); text-align:center; padding: 8px;
  }
  .links a{
    display:inline-block; margin-right: 10px; font-size: 0.82rem; color: var(--stamp);
    text-decoration: none; border-bottom: 1px solid var(--stamp); padding-bottom: 1px;
  }
  .links a:hover{ opacity:0.7; }
  @media (max-width: 560px){
    .card summary{ grid-template-columns: 60px 1fr auto; }
    .detail{ grid-template-columns: 80px 1fr; }
  }
</style>
</head>
<body>

  <div class="drawer-label">
    <h1>Ian's Library</h1>
    <span class="sub">Live from Google Sheet</span>
  </div>
  <div class="meta-row">
    <span id="count-flag">Loading…</span>
    <span>Editing happens in the Sheet</span>
  </div>
  <div class="status-banner" id="status-banner"></div>

  <div class="controls">
    <input type="text" class="search-box" id="search-box" placeholder="Search by title or author...">
    <div class="cat-filters" id="cat-filters"></div>
  </div>

  <div class="start-state" id="start-state">Search above, pick a category, or <button class="show-all-btn" id="show-all-btn">Show all</button></div>

  <div class="grid" id="grid"></div>
  <div class="no-results" id="no-results">No books match — try a different search or clear the category filter.</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSPhjzEy-zIQ5uwHmyA2ZGtc3RpuaGsQQqWhoRHivetBg1Th-p1utTCbbU1vhkIuFyAgRTC3M-XcdwA/pub?output=csv";

function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row = []; field = ''; }
        if(c === '\r' && next === '\n') i++;
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function fetchSheetBooks(){
  try{
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const header = rows[0].map(h => h.trim());
    return rows.slice(1).filter(r => r.length > 1 && r[0]).map(r => {
      const obj = {};
      header.forEach((h, i) => { if(h) obj[h] = (r[i] || '').trim(); });
      obj.categories = obj.categories ? obj.categories.split('|').filter(Boolean) : [];
      return obj;
    });
  }catch(e){
    console.error('Could not load live Sheet data', e);
    document.getElementById('status-banner').textContent = "Couldn't reach the live Sheet right now — check your connection.";
    document.getElementById('status-banner').classList.add('show');
    return [];
  }
}

function renderNotesMarkdown(text){
  const paragraphs = text.trim().split(/\n\s*\n/);
  return paragraphs.map(p =>
    p.split('\n').map(line => line.trim()
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\*(.+?)\*/g, '<i>$1</i>')
    ).join('<br>')
  ).join('<br><br>');
}

const grid = document.getElementById('grid');

async function init(){
  const sheetBooks = await fetchSheetBooks();
      const books = sheetBooks;
  function parseUKDate(d){ if(!d) return null; const parts = String(d).trim().split('/'); if(parts.length !== 3) return null; const day = parseInt(parts[0], 10), month = parseInt(parts[1], 10), year = parseInt(parts[2], 10); if(!day || !month || !year) return null; return new Date(year, month - 1, day); }
  books.sort((a, b) => { const da = parseUKDate(a.purchaseDate); const db = parseUKDate(b.purchaseDate); if(da && db) return db - da; if(da && !db) return -1; if(!da && db) return 1; return (a.title || '').localeCompare(b.title || ''); });
  document.getElementById('count-flag').textContent = books.length + ' titles catalogued';

  books.forEach((b) => {
    const details = document.createElement('details');
    details.className = 'card' + (b.summary ? ' has-detail' : '');
    details.dataset.title = (b.title || '').toLowerCase();
    details.dataset.author = (b.author || '').toLowerCase();
    details.dataset.categories = (b.categories || []).join('|').toLowerCase();

    const notesBadge = b.notes ? `<span class="notes-flag">Notes</span>` : '';
    const topMetaParts = [];
    if(b.purchaseDate) topMetaParts.push(`Purchased ${b.purchaseDate}`);
    if(b.source) topMetaParts.push(b.source);
    const topMetaLine = topMetaParts.length ? `<div class="card-meta-top">${topMetaParts.join(' &middot; ')}</div>` : '';

    const summaryEl = document.createElement('summary');
    summaryEl.innerHTML = `
      <span class="callnum">${b.asin || ''}</span>
      <span class="title-author">
        <div class="title">${b.title || ''}${notesBadge}</div>
        <div class="author">${b.author || ''}</div>
        ${topMetaLine}
        <div class="card-cats">${(b.categories || []).map(c => `<span>${c}</span>`).join('')}</div>
      </span>
      <span class="chevron">&#9656;</span>
    `;

    const meta = [];
    if(b.pubDate) meta.push(`<span class="meta-item"><b>Published:</b> ${b.pubDate}</span>`);
    const metaRow = meta.length ? `<div class="meta-line">${meta.join('')}</div>` : '';

    function expandBox(label, text){
      if(!text) return '';
      const id = 'eb-' + Math.random().toString(36).slice(2,9);
      return `<div class="expand-box"><label>${label}</label><p class="expand-text" id="${id}">${text}</p><button class="expand-btn" data-target="${id}">Show more</button></div>`;
    }

    function notesExpandBox(text){
      if(!text) return '';
      const trimmed = text.trim();
      const isFileRef = /^notes\/[\w.-]+\.md$/i.test(trimmed);
      const id = 'eb-' + Math.random().toString(36).slice(2,9);
      const body = isFileRef ? 'Loading notes\u2026' : trimmed;
      const srcAttr = isFileRef ? ` data-notes-src="${trimmed}"` : '';
      return `<div class="expand-box"><label>Reading notes</label><p class="expand-text" id="${id}"${srcAttr}>${body}</p><button class="expand-btn" data-target="${id}">Show more</button></div>`;
    }

    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.innerHTML = `
      <div class="cover">
                <img src="covers/${b.asin || ''}.jpg" alt="${b.title || ''} cover"
             onerror="this.parentNode.innerHTML='<div class=&quot;noimg&quot;>No cover found</div>'">
      </div>
      <div class="info">
        ${metaRow}
        ${b.goodreadsRating ? `<div class="rating-line">${b.goodreadsRating}</div>` : ''}
        ${expandBox('About the author', b.authorBio)}
        ${expandBox('Summary', b.summary)}
        ${notesExpandBox(b.notes)}
        <div class="links">
          <a href="${b.amazon}" target="_blank" rel="noopener">Amazon &rarr;</a>
          <a href="${b.goodreads}" target="_blank" rel="noopener">Goodreads &rarr;</a>
        </div>
      </div>
    `;

    details.appendChild(summaryEl);
    details.appendChild(detail);
    grid.appendChild(details);
  });

  document.querySelectorAll('[data-notes-src]').forEach(async (el) => {
    document.querySelectorAll('[data-notes-src]').forEach(async (el) => {
    try{
      const res = await fetch(el.dataset.notesSrc);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(!text.trim()) throw new Error('empty notes file');
      el.innerHTML = renderNotesMarkdown(text);
    }catch(e){
      const box = el.closest('.expand-box');
      if(box) box.remove();
    }
  });

  document.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = document.getElementById(btn.dataset.target);
      const open = text.classList.toggle('open');
      btn.textContent = open ? 'Show less' : 'Show more';
    });
  });

  const filterBar = document.getElementById('cat-filters');
  const searchBox = document.getElementById('search-box');
  const noResults = document.getElementById('no-results');
  const startState = document.getElementById('start-state');
  const showAllBtn = document.getElementById('show-all-btn');
  let activeCat = null;
  let showAll = false;

  function allCategories(){
    const set = new Set();
    document.querySelectorAll('.card').forEach(c => (c.dataset.categories || '').split('|').filter(Boolean).forEach(cat => set.add(cat)));
    return Array.from(set).sort();
  }
  function renderChips(){
    filterBar.innerHTML = '';
    allCategories().forEach(cat => {
      const chip = document.createElement('button');
      chip.className = 'cat-chip' + (activeCat === cat ? ' active' : '');
      chip.textContent = cat;
      chip.addEventListener('click', () => { activeCat = (activeCat === cat) ? null : cat; renderChips(); applyFilters(); });
      filterBar.appendChild(chip);
    });
  }
  function applyFilters(){
    const q = searchBox.value.trim().toLowerCase();
    const active = showAll || !!q || !!activeCat;
    let visible = 0;
    document.querySelectorAll('.card').forEach(card => {
      if(!active){ card.style.display = 'none'; return; }
      const matchesText = !q || card.dataset.title.includes(q) || card.dataset.author.includes(q);
              const matchesCat = !activeCat || (card.dataset.categories || '').split('|').includes(activeCat.toLowerCase());
      const show = matchesText && matchesCat;
      card.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    startState.style.display = active ? 'none' : 'block';
    noResults.style.display = (active && visible === 0) ? 'block' : 'none';
  }
  searchBox.addEventListener('input', applyFilters);
  showAllBtn.addEventListener('click', () => { showAll = true; applyFilters(); });
  renderChips();
  applyFilters();
}

init();
</script>

</body>
</html>
